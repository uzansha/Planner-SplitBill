<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBQ & Camp Planner</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 selection:bg-orange-500 selection:text-white">

  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-slate-900 border-x border-slate-800/80">
    
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl shadow-lg shadow-orange-500/20 text-white">
          <i data-lucide="flame" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">BBQ & Camp</h1>
          <p class="text-xs font-medium text-slate-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sync Online
          </p>
        </div>
      </div>

      <button id="btnResetData" class="p-2.5 text-slate-400 hover:text-red-400 hover:bg-slate-800/80 rounded-xl transition-all duration-200" title="Reset Semua Data">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </header>

    <main class="flex-1 px-4 py-5 space-y-6">

      <section class="bg-gradient-to-br from-slate-800/90 via-slate-800/60 to-slate-900/80 border border-slate-700/60 rounded-3xl p-5 shadow-xl backdrop-blur-sm">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-orange-400 flex items-center gap-1.5">
            <i data-lucide="wallet" class="w-4 h-4"></i> Ringkasan Biaya
          </span>
          <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-700/50 rounded-full px-3 py-1">
            <i data-lucide="users" class="w-3.5 h-3.5 text-slate-400"></i>
            <input type="number" id="peopleCount" value="4" min="1" class="w-8 text-center bg-transparent text-xs font-bold text-white focus:outline-none focus:ring-0">
            <span class="text-[11px] font-semibold text-slate-400">Orang</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-3">
            <p class="text-[11px] font-medium text-slate-400 mb-1">Total Estimasi</p>
            <p id="totalEstimasiText" class="text-base font-bold text-slate-200">Rp 0</p>
          </div>
          <div class="bg-slate-900/60 border border-orange-500/20 rounded-2xl p-3 bg-orange-500/5">
            <p class="text-[11px] font-medium text-orange-300/80 mb-1">Total Realisasi (Dibeli)</p>
            <p id="totalAktualText" class="text-base font-bold text-orange-400">Rp 0</p>
          </div>
        </div>

        <div class="bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-3.5 text-white flex items-center justify-between shadow-lg shadow-orange-500/15 mb-3">
          <div>
            <p class="text-[10px] font-semibold text-orange-100/90 uppercase tracking-wide">Patungan / Person</p>
            <p id="perPersonText" class="text-base font-extrabold tracking-tight">Rp 0</p>
          </div>
          <div class="text-right border-l border-orange-400/50 pl-3">
            <p class="text-[10px] font-semibold text-orange-100/90 uppercase tracking-wide">Total Kas Terkumpul</p>
            <p id="totalKasTerkumpulText" class="text-base font-extrabold tracking-tight">Rp 0</p>
          </div>
        </div>

        <div class="bg-slate-900/90 border border-emerald-500/30 rounded-2xl p-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="p-2 bg-emerald-500/10 rounded-xl text-emerald-400">
              <i data-lucide="piggy-bank" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="text-[11px] font-bold text-emerald-400 uppercase tracking-wide">Sisa Uang Kas</p>
              <p class="text-[10px] text-slate-400">Total kas dikurangi belanjaan asli</p>
            </div>
          </div>
          <p id="sisaUangText" class="text-base font-extrabold text-emerald-400">Rp 0</p>
        </div>
      </section>

      <nav class="flex bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700/50">
        <button id="tabBelanja" class="flex-1 py-2.5 rounded-xl font-semibold text-xs transition-all duration-200 flex items-center justify-center gap-2 bg-orange-500 text-white shadow-md">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> Barang Belanjaan
        </button>
        <button id="tabBawaan" class="flex-1 py-2.5 rounded-xl font-semibold text-xs text-slate-400 hover:text-slate-200 transition-all duration-200 flex items-center justify-center gap-2">
          <i data-lucide="package" class="w-4 h-4"></i> Peralatan Bawaan
        </button>
      </nav>

      <section id="contentBelanja" class="space-y-4">
        <form id="formBelanja" class="bg-slate-800/40 border border-slate-800 p-3.5 rounded-2xl space-y-3">
          <input type="text" id="inputNamaBelanja" placeholder="Nama bahan / belanjaan..." required class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
          
          <div class="flex gap-2">
            <div class="w-24">
              <label class="text-[10px] text-slate-400 block mb-1 font-medium">Jumlah (Pcs)</label>
              <input type="number" id="inputQtyBelanja" placeholder="1" min="1" value="1" required class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 text-center placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
            </div>
            <div class="flex-1">
              <label class="text-[10px] text-slate-400 block mb-1 font-medium">Est. Harga Satuan (Rp)</label>
              <input type="number" id="inputEstimasiHarga" placeholder="Satuan Rp" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
            </div>
          </div>

          <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-orange-400 font-semibold text-xs py-2.5 rounded-xl border border-orange-500/30 flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
            <i data-lucide="plus" class="w-4 h-4"></i> Tambah Item Belanja
          </button>
        </form>

        <div class="flex items-center justify-between px-1">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Bahan & Makanan</p>
          <span id="countBelanja" class="text-[11px] font-semibold bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full">0 Item</span>
        </div>

        <div id="listBelanja" class="space-y-2.5"></div>
      </section>

      <section id="contentBawaan" class="space-y-4 hidden">
        <form id="formBawaan" class="bg-slate-800/40 border border-slate-800 p-3.5 rounded-2xl flex gap-2">
          <input type="text" id="inputNamaBawaan" placeholder="Nama alat (Panggangan, Tikar)..." required class="flex-1 bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-colors">
          <button type="submit" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 font-semibold text-xs px-4 py-2.5 rounded-xl border border-amber-500/30 flex items-center justify-center gap-1.5 transition-all shrink-0">
            <i data-lucide="plus" class="w-4 h-4"></i> Tambah
          </button>
        </form>

        <div class="flex items-center justify-between px-1">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Perlengkapan Rumah</p>
          <span id="countBawaan" class="text-[11px] font-semibold bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full">0 Item</span>
        </div>

        <div id="listBawaan" class="space-y-2.5"></div>
      </section>

    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Asli Kamu
    const firebaseConfig = {
      apiKey: "AIzaSyAWQjX4-dUtDOHzVCgDZqlXSzzEjCk4tAs",
      authDomain: "bbq-planner-a6b2a.firebaseapp.com",
      databaseURL: "https://bbq-planner-a6b2a-default-rtdb.firebaseio.com",
      projectId: "bbq-planner-a6b2a",
      storageBucket: "bbq-planner-a6b2a.firebasestorage.app",
      messagingSenderId: "47450695980",
      appId: "1:47450695980:web:83ddfc0e29739657eb6489"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'bbq_data');

    let appState = {
      people: 4,
      belanja: [],
      bawaan: []
    };

    // Sinkronisasi data realtime dari Firebase Cloud
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        appState = {
          people: data.people || 1,
          belanja: data.belanja || [],
          bawaan: data.bawaan || []
        };
      }
      render();
    });

    function pushData() {
      set(dbRef, appState);
    }

    function formatRp(value) {
      return 'Rp ' + (value || 0).toLocaleString('id-ID');
    }

    const peopleInput = document.getElementById('peopleCount');
    const totalEstimasiText = document.getElementById('totalEstimasiText');
    const totalAktualText = document.getElementById('totalAktualText');
    const perPersonText = document.getElementById('perPersonText');
    const totalKasTerkumpulText = document.getElementById('totalKasTerkumpulText');
    const sisaUangText = document.getElementById('sisaUangText');
    
    const tabBelanja = document.getElementById('tabBelanja');
    const tabBawaan = document.getElementById('tabBawaan');
    const contentBelanja = document.getElementById('contentBelanja');
    const contentBawaan = document.getElementById('contentBawaan');

    const formBelanja = document.getElementById('formBelanja');
    const formBawaan = document.getElementById('formBawaan');
    const listBelanja = document.getElementById('listBelanja');
    const listBawaan = document.getElementById('listBawaan');

    const countBelanja = document.getElementById('countBelanja');
    const countBawaan = document.getElementById('countBawaan');

    tabBelanja.addEventListener('click', () => {
      tabBelanja.className = "flex-1 py-2.5 rounded-xl font-semibold text-xs transition-all duration-200 flex items-center justify-center gap-2 bg-orange-500 text-white shadow-md";
      tabBawaan.className = "flex-1 py-2.5 rounded-xl font-semibold text-xs text-slate-400 hover:text-slate-200 transition-all duration-200 flex items-center justify-center gap-2";
      contentBelanja.classList.remove('hidden');
      contentBawaan.classList.add('hidden');
    });

    tabBawaan.addEventListener('click', () => {
      tabBawaan.className = "flex-1 py-2.5 rounded-xl font-semibold text-xs transition-all duration-200 flex items-center justify-center gap-2 bg-amber-500 text-white shadow-md";
      tabBelanja.className = "flex-1 py-2.5 rounded-xl font-semibold text-xs text-slate-400 hover:text-slate-200 transition-all duration-200 flex items-center justify-center gap-2";
      contentBawaan.classList.remove('hidden');
      contentBelanja.classList.add('hidden');
    });

    peopleInput.addEventListener('change', (e) => {
      const val = parseInt(e.target.value);
      appState.people = val > 0 ? val : 1;
      pushData();
    });

    formBelanja.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = document.getElementById('inputNamaBelanja').value.trim();
      const qty = parseInt(document.getElementById('inputQtyBelanja').value) || 1;
      const estimasi = parseInt(document.getElementById('inputEstimasiHarga').value) || 0;

      if (nama) {
        if (!appState.belanja) appState.belanja = [];
        appState.belanja.push({
          id: Date.now(),
          nama: nama,
          qty: qty,
          estimasi: estimasi,
          aktual: 0,
          bought: false
        });
        document.getElementById('inputNamaBelanja').value = '';
        document.getElementById('inputQtyBelanja').value = '1';
        document.getElementById('inputEstimasiHarga').value = '';
        pushData();
      }
    });

    formBawaan.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = document.getElementById('inputNamaBawaan').value.trim();

      if (nama) {
        if (!appState.bawaan) appState.bawaan = [];
        appState.bawaan.push({
          id: Date.now(),
          nama: nama,
          packed: false
        });
        document.getElementById('inputNamaBawaan').value = '';
        pushData();
      }
    });

    document.getElementById('btnResetData').addEventListener('click', () => {
      if (confirm('Reset seluruh data belanjaan dan peralatan untuk semua orang?')) {
        appState = {
          people: 4,
          belanja: [],
          bawaan: []
        };
        pushData();
      }
    });

    window.toggleBought = function(id) {
      const item = appState.belanja.find(i => i.id === id);
      if (item) {
        item.bought = !item.bought;
        if (item.bought && (!item.aktual || item.aktual === 0)) {
          item.aktual = item.estimasi;
        }
        pushData();
      }
    };

    window.updateQty = function(id, val) {
      const item = appState.belanja.find(i => i.id === id);
      if (item) {
        item.qty = parseInt(val) || 1;
        pushData();
      }
    };

    window.updateEstimasi = function(id, val) {
      const item = appState.belanja.find(i => i.id === id);
      if (item) {
        item.estimasi = parseInt(val) || 0;
        pushData();
      }
    };

    window.updateAktual = function(id, val) {
      const item = appState.belanja.find(i => i.id === id);
      if (item) {
        item.aktual = parseInt(val) || 0;
        pushData();
      }
    };

    window.deleteBelanja = function(id) {
      appState.belanja = appState.belanja.filter(i => i.id !== id);
      pushData();
    };

    window.togglePacked = function(id) {
      const item = appState.bawaan.find(i => i.id === id);
      if (item) {
        item.packed = !item.packed;
        pushData();
      }
    };

    window.deleteBawaan = function(id) {
      appState.bawaan = appState.bawaan.filter(i => i.id !== id);
      pushData();
    };

    function render() {
      const belanjaList = appState.belanja || [];
      const bawaanList = appState.bawaan || [];

      const totalEstimasi = belanjaList.reduce((sum, i) => sum + ((i.estimasi || 0) * (i.qty || 1)), 0);
      const totalAktual = belanjaList
        .filter(i => i.bought)
        .reduce((sum, i) => sum + ((i.aktual || 0) * (i.qty || 1)), 0);
      
      const people = appState.people || 1;
      const perPerson = Math.ceil(totalEstimasi / people);
      const totalKasTerkumpul = perPerson * people;
      const sisaUang = totalKasTerkumpul - totalAktual;

      peopleInput.value = people;
      totalEstimasiText.textContent = formatRp(totalEstimasi);
      totalAktualText.textContent = formatRp(totalAktual);
      perPersonText.textContent = formatRp(perPerson);
      totalKasTerkumpulText.textContent = formatRp(totalKasTerkumpul);
      
      sisaUangText.textContent = formatRp(sisaUang);
      if (sisaUang < 0) {
        sisaUangText.className = "text-base font-extrabold text-red-400";
      } else {
        sisaUangText.className = "text-base font-extrabold text-emerald-400";
      }

      countBelanja.textContent = `${belanjaList.length} Item`;
      countBawaan.textContent = `${bawaanList.length} Item`;

      listBelanja.innerHTML = '';
      if (belanjaList.length === 0) {
        listBelanja.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Belum ada daftar belanjaan.</p>`;
      } else {
        belanjaList.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = `p-3.5 rounded-2xl border transition-all duration-200 flex flex-col gap-2.5 ${
            item.bought 
              ? 'bg-slate-800/40 border-slate-800/80 opacity-90' 
              : 'bg-slate-800/80 border-slate-700/60 shadow-sm'
          }`;

          const subtotalAktual = (item.aktual || 0) * (item.qty || 1);

          itemEl.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <label class="flex items-center gap-3 cursor-pointer select-none flex-1 min-w-0">
                <input type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleBought(${item.id})" class="w-4 h-4 rounded-md border-slate-600 text-orange-500 focus:ring-0 focus:ring-offset-0 bg-slate-900 cursor-pointer">
                <span class="text-xs font-semibold ${item.bought ? 'line-through text-slate-400' : 'text-slate-100'} truncate">${item.nama}</span>
              </label>
              <button onclick="deleteBelanja(${item.id})" class="text-slate-500 hover:text-red-400 p-1 rounded-lg transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 text-[11px] pt-2 border-t border-slate-700/40 items-center">
              <div class="flex items-center gap-1">
                <span class="text-slate-400">Pcs:</span>
                <input type="number" value="${item.qty || 1}" min="1" onchange="updateQty(${item.id}, this.value)" class="w-full bg-slate-900 border border-slate-700/70 rounded-lg py-0.5 text-center text-xs font-semibold text-slate-200 focus:outline-none focus:border-orange-500">
              </div>

              <div class="flex flex-col gap-0.5">
                <span class="text-[9px] text-slate-400">Est. Satuan:</span>
                <div class="relative flex items-center">
                  <span class="absolute left-1.5 text-[9px] text-slate-500">Rp</span>
                  <input type="number" value="${item.estimasi || ''}" placeholder="0" onchange="updateEstimasi(${item.id}, this.value)" class="w-full bg-slate-900 border border-slate-700/70 rounded-lg pl-5 pr-1 py-0.5 text-right text-xs font-semibold text-slate-300 focus:outline-none focus:border-orange-500">
                </div>
              </div>

              <div class="flex flex-col gap-0.5">
                <span class="text-[9px] text-slate-400">Harga Beli:</span>
                <div class="relative flex items-center">
                  <span class="absolute left-1.5 text-[9px] text-slate-500">Rp</span>
                  <input type="number" value="${item.aktual || ''}" placeholder="0" onchange="updateAktual(${item.id}, this.value)" ${!item.bought ? 'disabled' : ''} class="w-full bg-slate-900 border border-slate-700/70 rounded-lg pl-5 pr-1 py-0.5 text-right text-xs font-semibold text-orange-400 focus:outline-none focus:border-orange-500 disabled:opacity-40 disabled:bg-slate-950">
                </div>
              </div>
            </div>

            ${item.bought ? `
              <div class="text-[10px] text-right font-medium text-orange-300/80 pt-0.5">
                Subtotal Belanja: <span class="font-bold text-orange-400">${formatRp(subtotalAktual)}</span>
              </div>
            ` : ''}
          `;
          listBelanja.appendChild(itemEl);
        });
      }

      listBawaan.innerHTML = '';
      if (bawaanList.length === 0) {
        listBawaan.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Belum ada daftar peralatan bawaan.</p>`;
      } else {
        bawaanList.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = `p-3.5 rounded-2xl border transition-all duration-200 flex items-center justify-between gap-2 ${
            item.packed 
              ? 'bg-slate-800/40 border-slate-800/80 opacity-80' 
              : 'bg-slate-800/80 border-slate-700/60 shadow-sm'
          }`;

          itemEl.innerHTML = `
            <label class="flex items-center gap-3 cursor-pointer select-none flex-1 min-w-0">
              <input type="checkbox" ${item.packed ? 'checked' : ''} onchange="togglePacked(${item.id})" class="w-4 h-4 rounded-md border-slate-600 text-amber-500 focus:ring-0 focus:ring-offset-0 bg-slate-900 cursor-pointer">
              <span class="text-xs font-semibold ${item.packed ? 'line-through text-slate-400' : 'text-slate-100'} truncate">${item.nama}</span>
            </label>
            <button onclick="deleteBawaan(${item.id})" class="text-slate-500 hover:text-red-400 p-1 rounded-lg transition-colors">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          `;
          listBawaan.appendChild(itemEl);
        });
      }

      lucide.createIcons();
    }
  </script>
</body>
</html>
